name: testpilot
x-logging: &bounded-logs
  driver: json-file
  options: {max-size: 10m, max-file: "3"}
services:
  qdrant:
    logging: *bounded-logs
    image: qdrant/qdrant:v1.16.3
    environment:
      QDRANT__SERVICE__API_KEY: ${TESTPILOT_QDRANT_API_KEY}
    volumes: [knowledge:/qdrant/storage]
    networks: [management]
    mem_limit: 512m
    restart: unless-stopped
  redis:
    logging: *bounded-logs
    image: redis:7.4-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${TESTPILOT_REDIS_PASSWORD}
    command: [sh, -c, 'exec redis-server --appendonly yes --appendfsync everysec --maxmemory 256mb --maxmemory-policy noeviction --requirepass "$$REDIS_PASSWORD"']
    volumes: [queue:/data]
    networks: [management]
    mem_limit: 512m
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG']
      interval: 3s
      retries: 30
  mysql:
    logging: *bounded-logs
    restart: unless-stopped
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: testpilot
      MYSQL_USER: testpilot
      MYSQL_PASSWORD: ${TESTPILOT_DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${TESTPILOT_DB_ROOT_PASSWORD}
    volumes:
    - database:/var/lib/mysql
    networks:
    - management
    healthcheck:
      test:
      - CMD-SHELL
      - MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u testpilot testpilot -e 'SELECT 1' >/dev/null
      interval: 3s
      retries: 30
  api:
    logging: *bounded-logs
    image: testpilot-runtime:0.1
    command: [python, -m, testpilot.serve]
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: platform.env
    environment:
      TESTPILOT_DATA: /data
      PYTHONPATH: /app/src
      TESTPILOT_ROLE: platform
      TESTPILOT_MODEL_KEY: ''
      TESTPILOT_RUNTIME_URL: https://executor:8021
      TESTPILOT_TLS_CERT_FILE: /tls/platform.pem
      TESTPILOT_TLS_KEY_FILE: /tls/platform-key.pem
      SSL_CERT_FILE: /tls/ca-bundle.pem
      REQUESTS_CA_BUNDLE: /tls/ca-bundle.pem
    volumes:
    - ../.runtime:/data
    - ../src:/app/src:ro
    - ../skills:/app/skills:ro
    - ../web/dist:/app/web/dist:ro
    # 仅挂载本服务的叶证书、私钥和公开 CA bundle；CA 签名私钥不进入服务。
    - ${TESTPILOT_TLS_DIR:?请先生成本地HTTPS证书}/platform.pem:/tls/platform.pem:ro
    - ${TESTPILOT_TLS_DIR:?请先生成本地HTTPS证书}/platform-key.pem:/tls/platform-key.pem:ro
    - ${TESTPILOT_TLS_DIR:?请先生成本地HTTPS证书}/ca-bundle.pem:/tls/ca-bundle.pem:ro
    ports:
    - 127.0.0.1:8020:8020
    networks:
    - management
    - entry
    depends_on:
      qdrant:
        condition: service_started
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
  executor:
    logging: *bounded-logs
    image: testpilot-runtime:0.1
    command: [python, -m, testpilot.local_executor]
    env_file:
    - path: ../.client/execution.env
      required: false
    - runtime.env
    environment:
      TESTPILOT_ROLE: gateway
      TESTPILOT_PLATFORM_URL: https://api:8020
      TESTPILOT_CLIENT_ORIGIN: https://127.0.0.1:8020
      TESTPILOT_TLS_CERT_FILE: /tls/executor.pem
      TESTPILOT_TLS_KEY_FILE: /tls/executor-key.pem
      SSL_CERT_FILE: /tls/ca-bundle.pem
      REQUESTS_CA_BUNDLE: /tls/ca-bundle.pem
      TESTPILOT_CLIENT_BIND: 0.0.0.0
      TESTPILOT_CLIENT_ROOT: /client
      TESTPILOT_CLIENT_HOST_ROOT: ${TESTPILOT_CLIENT_HOST_ROOT}
      TESTPILOT_DATA: /client/scratch
      TESTPILOT_DATABASE_URL: sqlite:////client/gateway.sqlite
      PYTHONPATH: /app/src
      BROWSER_USE_LOGGING_LEVEL: warning
    volumes:
    - ../.client:/client
    - ../src:/app/src:ro
    - ../skills:/app/skills:ro
    - ${TESTPILOT_TLS_DIR:?请先生成本地HTTPS证书}/executor.pem:/tls/executor.pem:ro
    - ${TESTPILOT_TLS_DIR:?请先生成本地HTTPS证书}/executor-key.pem:/tls/executor-key.pem:ro
    - ${TESTPILOT_TLS_DIR:?请先生成本地HTTPS证书}/ca-bundle.pem:/tls/ca-bundle.pem:ro
    - /var/run/docker.sock:/var/run/docker.sock
    networks: [entry, targets, outbound]
    extra_hosts: [host.docker.internal:host-gateway]
    shm_size: 512mb
    mem_limit: 4g
    cpus: 3
    restart: unless-stopped
    depends_on: [api]
networks:
  management: null
  targets:
    name: testpilot-targets
    internal: true
  entry:
    name: testpilot-entry
  outbound: null
volumes:
  knowledge: null
  queue: null
  database: null
  android: null
