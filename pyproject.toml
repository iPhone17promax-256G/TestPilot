[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aiqa"
version = "0.1.0"
description = "Executable testing assets and a persistent testing agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<3",
  "pymysql[rsa]>=1.1,<2", "httpx>=0.28,<1", "pydantic-settings>=2.7,<3",
  "docker>=7.1,<8", "typer>=0.15,<1", "mcp>=1.20,<2",
  "langchain>=1.0,<2", "langchain-openai>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4", "langgraph-checkpoint-mysql[pymysql]>=2,<4", "browser-use>=0.11,<1",
  "pytest>=8,<10", "pytest-playwright>=0.7,<1", "playwright>=1.55,<2",
  "Appium-Python-Client>=5,<6", "pytest-timeout>=2.3,<3", "requests>=2.32,<3", "pypdf>=6.16,<7", "python-docx>=1.2,<2", "jmespath>=1.1,<2", "jsonpath-ng>=1.9,<2", "PyYAML>=6,<7", "cryptography>=46,<51", "jsonschema>=4,<5"
]

[project.scripts]
aiqa = "aiqa.integrations.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
